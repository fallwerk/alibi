  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; font-family: 'Courier New', monospace; overflow: hidden; }

    #ui-overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      pointer-events: none; z-index: 999;
    }

    #scanline {
      position: absolute; top: 0; left: 0; right: 0;
      height: 2px;
      background: rgba(0,255,0,0.3);
      animation: scanline 4s linear infinite;
    }
    @keyframes scanline {
      0% { top: 0; } 100% { top: 100%; }
    }

    #corner-tl, #corner-tr, #corner-bl, #corner-br {
      position: absolute; width: 30px; height: 30px;
      border-color: #00ff41; border-style: solid;
    }
    #corner-tl { top: 16px; left: 16px; border-width: 2px 0 0 2px; }
    #corner-tr { top: 16px; right: 16px; border-width: 2px 2px 0 0; }
    #corner-bl { bottom: 16px; left: 16px; border-width: 0 0 2px 2px; }
    #corner-br { bottom: 16px; right: 16px; border-width: 0 2px 2px 0; }

    #status {
      position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%);
      color: #00ff41; font-size: 11px; letter-spacing: 3px; text-transform: uppercase;
      text-shadow: 0 0 8px #00ff41;
      animation: blink 1.5s step-end infinite;
    }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.2} }

    #timestamp {
      position: absolute; top: 20px; right: 60px;
      color: #00ff41; font-size: 11px; letter-spacing: 2px;
      text-shadow: 0 0 6px #00ff41;
    }

    #label {
      position: absolute; top: 20px; left: 60px;
      color: #00ff41; font-size: 11px; letter-spacing: 2px;
      text-shadow: 0 0 6px #00ff41;
    }

    #noise {
      position: absolute; inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      opacity: 0.06;
      animation: flicker 0.1s infinite;
    }
    @keyframes flicker { 0%,100%{opacity:0.06} 50%{opacity:0.03} }
  </style>

  <!-- Hiro Marker -->
  <a-marker preset="hiro" smooth="true" smoothCount="10" smoothTolerance="0.01" smoothThreshold="5">

    <!-- Foto 1: links -->
    <a-image
      src="#cam1"
      position="-0.65 0.6 0"
      rotation="-90 0 0"
      width="1.1"
      height="1.5"
      material="shader: flat; transparent: false; side: double"
      animation="property: position; from: -0.65 0.3 0; to: -0.65 0.6 0; dur: 800; easing: easeOutBack; startEvents: markerFound"
    >
      <!-- Grüner Rahmen Foto 1 -->
      <a-entity position="0 0 0.01">
        <a-plane width="1.14" height="1.54" material="color: #00ff41; opacity: 0.0; transparent: true; side: double" position="0 0 -0.005"></a-plane>
      </a-entity>
    </a-image>

    <!-- Foto 2: rechts -->
    <a-image
      src="#cam2"
      position="0.65 0.6 0"
      rotation="-90 0 0"
      width="1.1"
      height="1.5"
      material="shader: flat; transparent: false; side: double"
      animation="property: position; from: 0.65 0.3 0; to: 0.65 0.6 0; dur: 800; easing: easeOutBack; delay: 150; startEvents: markerFound"
    >
    </a-image>

    <!-- Verbindungslinie / Diptychon-Steg -->
    <a-box
      position="0 0.6 0"
      rotation="-90 0 0"
      width="0.06"
      height="1.5"
      depth="0.01"
      color="#00ff41"
      material="emissive: #00ff41; emissiveIntensity: 0.6; opacity: 0.85; transparent: true"
    ></a-box>

    <!-- Label Foto 1 -->
    <a-text
      value="CAM_01 // 21:19"
      position="-0.65 0.12 0"
      rotation="-90 0 0"
      align="center"
      color="#00ff41"
      width="1.5"
      font="https://cdn.aframe.io/fonts/Exo2Bold.fnt"
    ></a-text>

    <!-- Label Foto 2 -->
    <a-text
      value="CAM_02 // 21:22"
      position="0.65 0.12 0"
      rotation="-90 0 0"
      align="center"
      color="#00ff41"
      width="1.5"
      font="https://cdn.aframe.io/fonts/Exo2Bold.fnt"
    ></a-text>

    <!-- BEWEISMATERIAL label oben mitte -->
    <a-text
      value="⚠ BEWEISMATERIAL ⚠"
      position="0 1.45 0"
      rotation="-90 0 0"

      color="#ff2200"
      width="2"

<!-- UI Overlay -->
<div id="ui-overlay">
  <div id="noise"></div>
  <div id="scanline"></div>
  <div id="corner-tl"></div>
  <div id="corner-tr"></div>
  <div id="corner-bl"></div>
  <div id="corner-br"></div>
  <div id="label">WALLIS // KRIMI</div>
  <div id="timestamp" id="ts"></div>
  <div id="status">▶ HIRO-MARKER SCANNEN</div>
</div>

<script>
  // Live-Uhrzeit
  const ts = document.getElementById('timestamp');
  setInterval(() => {
    const n = new Date();
    ts.textContent = n.toLocaleTimeString('de-CH', {hour:'2-digit',minute:'2-digit',second:'2-digit'}) + ' // REC ●';
  }, 1000);

  // Status-Text wenn Marker gefunden
  const marker = document.querySelector('a-marker');
  const status = document.getElementById('status');
  marker.addEventListener('markerFound', () => {
    status.textContent = '◉ BEWEISMITTEL ERKANNT';
    status.style.color = '#ff2200';
    status.style.textShadow = '0 0 8px #ff2200';
    status.style.animation = 'none';
  });
  marker.addEventListener('markerLost', () => {
    status.textContent = '▶ HIRO-MARKER SCANNEN';
    status.style.color = '#00ff41';
    status.style.textShadow = '0 0 8px #00ff41';
    status.style.animation = 'blink 1.5s step-end infinite';
  });
</script>
